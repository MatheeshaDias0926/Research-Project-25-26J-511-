; PlatformIO Project Configuration File
; Smart Bus Safety System — ESP32 with NEO-6M GPS Module
;
; Hardware:
;   - ESP32 DevKit v1 (ESP32-WROOM-32)
;   - IR Sensors on GPIO 18, 19
;   - NEO-6M GPS Module on UART2 (GPIO 16 RX, 17 TX)
;
; Libraries:
;   - ArduinoJson: JSON payload building
;   - TinyGPSPlus: Parse NMEA sentences from NEO-6M GPS

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    mikalhart/TinyGPSPlus@^1.0.3
